<!-- base.html
     This is the "master" template. Every other page (index.html,
     students.html, add_student.html, edit_student.html) extends
     this file, so the navigation bar and overall page style only
     need to be written once. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <!-- Link to our CSS file (Flask serves files inside /static/ automatically) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">🎓 Student Management System</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('students') }}">View Students</a>
            <a href="{{ url_for('add_student') }}">Add Student</a>
        </div>
    </nav>

    <!-- Main page content. Each child template fills in this block. -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Link to our JS file -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
