<!-- add_student.html — Form to add a new student -->
{% extends "base.html" %}

{% block content %}
<h2>Add a New Student</h2>

{% if error %}
    <p class="error-message">{{ error }}</p>
{% endif %}

<!-- This form sends a POST request to the /add route in app.py -->
<form class="student-form" action="{{ url_for('add_student') }}" method="POST">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter full name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter email address" required>

    <label for="course">Course</label>
    <input type="text" id="course" name="course" placeholder="Enter course name" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" placeholder="Enter age" required>

    <button type="submit" class="btn btn-primary">Add Student</button>
</form>
{% endblock %}
