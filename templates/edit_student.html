<!-- edit_student.html — Form to edit an existing student -->
{% extends "base.html" %}

{% block content %}
<h2>Edit Student</h2>

{% if error %}
    <p class="error-message">{{ error }}</p>
{% endif %}

<!-- This form sends a POST request to /edit/<id>, pre-filled with existing data -->
<form class="student-form" action="{{ url_for('edit_student', id=student.id) }}" method="POST">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ student.name }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ student.email }}" required>

    <label for="course">Course</label>
    <input type="text" id="course" name="course" value="{{ student.course }}" required>

    <label for="age">Age</label>
    <input type="number" id="age" name="age" value="{{ student.age }}" required>

    <button type="submit" class="btn btn-primary">Update Student</button>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
